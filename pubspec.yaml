name: ink_mux
description: "InkMux - 一个兼容 OpenAI 图片接口的云端大模型图像生成与编辑的简单客户端。"
publish_to: 'none'
version: 0.1.0-beta.1+20261118

environment:
  sdk: ^3.13.7

dependencies:
  # 3.50 正式开始 ui就和flutter核心库拆分了
  material_ui: ^1.11.0
  desktop_drop: ^0.8.0
  dio: ^5.11.1
  extended_image: ^10.1.0
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^23.0.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  nativeapi: ^0.6.0
  path_provider: ^2.1.6
  saver_gallery: ^5.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  uuid: ^4.6.0
  archive: ^4.7.0
  path: ^1.9.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/tray/
